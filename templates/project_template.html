<!DOCTYPE html>
<!--
  Шаблон страницы проекта.
  Скопируйте этот файл и translation.js в projects/<название>/ и заполните.
  Переводимые строки помечаются атрибутом data-i18n="ключ"; сами строки лежат
  в соседнем translation.js (window.PAGE_I18N). Общие строки (шапка, hero) —
  в js/script.js -> COMMON_I18N. Пути ../../ рассчитаны на projects/<название>/.
-->
<html lang="ru" data-i18n-doc-title="doc.title">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проект</title>
    <link rel="icon" type="image/x-icon" href="../../images/favicon.png">
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/projects.css">
    <script src="translation.js"></script>
    <script src="../../js/script.js"></script>
</head>
<body class="theme-dark">
    <header class="main-header">
        <nav>
            <a href="../../index.html" class="nav-link" data-i18n="nav.back">← Назад к Портфолио</a>
            <div class="language-switcher">
                <span id="lang-ru" class="lang-btn">RU</span>
                <span class="separator">|</span>
                <span id="lang-en" class="lang-btn">EN</span>
            </div>
        </nav>
    </header>

    <main class="container">
        <section class="section">
            <h1 id="hero-title"></h1>
            <h2 id="hero-subtitle"></h2>
            <p class="tagline" id="hero-tagline"></p>
            <div class="contact-links"></div>

            <div class="project-detail-header">
                <h1 id="project-title" data-i18n="project.title">Название проекта</h1>
                <div class="project-stack">
                    <span>Tech 1</span>
                    <span>Tech 2</span>
                    <span>Tech 3</span>
                </div>
            </div>

            <div class="project-content">
                <div class="image-carousel">
                    <div class="carousel-track">
                        <div class="carousel-slide">
                            <img src="logo.png" alt="Скриншот 1">
                        </div>
                        <div class="carousel-slide">
                            <img src="img_1.png" alt="Скриншот 2">
                        </div>
                    </div>

                    <button class="carousel-btn prev" aria-label="Предыдущий слайд">←</button>
                    <button class="carousel-btn next" aria-label="Следующий слайд">→</button>

                    <div class="carousel-dots"></div>
                </div>

                <h2 id="overview-title" data-i18n="overview.title">Обзор Проекта</h2>
                <p id="overview-text" data-i18n="overview.text">Краткое описание проекта.</p>

                <h2 id="feature-title" data-i18n="feature.title">Функционал</h2>
                <ul id="feature-list">
                    <li><span data-i18n="point1">Пункт 1</span></li>
                    <li><span data-i18n="point2">Пункт 2</span></li>
                    <li><span data-i18n="point3">Пункт 3</span></li>
                </ul>
            </div>
        </section>
    </main>
</body>
</html>
